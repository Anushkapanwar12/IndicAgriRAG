[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indic-agri-rag"
version = "1.0.0"
description = "Evidence-grounded cross-lingual agricultural question answering over ICAR advisories"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
